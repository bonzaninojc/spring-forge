<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- Bigorna (anvil) -->
  <!-- Topo da bigorna -->
  <rect x="120" y="148" width="160" height="38" rx="6" fill="url(#g1)"/>
  <!-- Corno direito -->
  <path d="M260 148 Q295 148 300 162 L280 162 Z" fill="url(#g1)"/>
  <!-- Corno esquerdo pequeno -->
  <path d="M140 148 Q120 148 118 158 L138 158 Z" fill="url(#g1)"/>
  <!-- Corpo/pescoço da bigorna -->
  <rect x="168" y="186" width="64" height="22" rx="4" fill="url(#g1)"/>
  <!-- Base da bigorna -->
  <rect x="148" y="208" width="104" height="20" rx="6" fill="url(#g1)"/>

  <!-- Folha grande da direita -->
  <path d="M210 145 Q240 100 265 68 Q275 95 262 120 Q250 140 210 145 Z" fill="url(#g2)"/>
  <!-- Nervura folha grande -->
  <path d="M210 145 Q242 108 263 72" stroke="white" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- Folha esquerda menor -->
  <path d="M205 143 Q185 108 178 78 Q198 88 208 112 Q214 128 205 143 Z" fill="url(#g1)"/>
  <!-- Nervura folha esquerda -->
  <path d="M205 143 Q188 112 179 82" stroke="white" stroke-width="1.2" stroke-opacity="0.35" fill="none"/>

  <!-- Caule -->
  <path d="M208 228 L208 148" stroke="url(#g2)" stroke-width="3" stroke-linecap="round"/>

  <!-- Texto "spring" -->
  <text x="200" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#1E88E5" text-anchor="middle" letter-spacing="-0.5">spring</text>
  <!-- Texto "forge" -->
  <text x="200" y="272" font-family="'Segoe UI',Arial,sans-serif" font-size="38" font-weight="700" fill="#0A1628" text-anchor="middle" letter-spacing="-0.5" dx="80">forge</text>

  <!-- Linha separadora -->
  <line x1="130" y1="292" x2="163" y2="292" stroke="#1E88E5" stroke-width="1.5"/>
  <line x1="237" y1="292" x2="270" y2="292" stroke="#1E88E5" stroke-width="1.5"/>

  <!-- Texto "MAVEN PLUGIN" -->
  <text x="200" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#455A7A" text-anchor="middle" letter-spacing="3">MAVEN PLUGIN</text>
</svg>
